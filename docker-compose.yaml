services:
  postgres:
    image: postgres:latest
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d shop" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:latest
    container_name: shop-redis
    ports:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
  nats:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats_data:/data
    command: [ "-js", "-sd", "/data", "-m", "8222" ]
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: auth-service
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "${GRPC_AUTH_PORT}"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - .env
    depends_on:
      auth-service:
        condition: service_started
    ports:
      - "80:${GATEWAY_PORT}"
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  nats_data:

