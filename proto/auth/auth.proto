syntax = "proto3";

option go_package = "proto/auth;authpb";

service Auth {
  rpc Register (RegisterReq) returns (AuthRes);

  rpc Login (LoginReq) returns (AuthRes);

  rpc Refresh (RefreshReq) returns (AuthRes);

  rpc Validate (ValidateTokenReq) returns (ValidateTokenRes);
}

message RegisterReq {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  string phone = 5;
}

message LoginReq {
  string login = 1;
  string password = 2;
}

message AuthRes {
  string access_token = 1;
  string refresh_token = 2;
}

message UserRes {
  string id = 1;
  string email = 2;
  string phone = 3;

  bool email_verified = 4;
  bool phone_verified = 5;

  string role = 6;
  bool active = 7;
}

message ValidateTokenReq {
  string access_token = 1;
}

message RefreshReq {
  string refresh_token = 1;
}

message ValidateTokenRes {
  UserRes user = 1;
}
