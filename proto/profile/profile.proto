syntax = "proto3";

option go_package = "proto/profile;profilepb";

service Profile {
  rpc GetProfile(GetProfileReq) returns (ProfileRes);
  rpc UpdateProfile(UpdateProfileReq) returns(ProfileRes);
}

message GetProfileReq {
  string user_id = 1;
}

message UpdateProfileReq {
  string user_id = 1;

  optional string first_name = 2;
  optional string last_name = 3;
  optional string middle_name = 4;

  optional string date_of_birth = 5;
}

message ProfileRes {
  string id = 1;
  string user_id = 2;

  string first_name = 3;
  string last_name = 4;
  string middle_name = 5;

  string date_of_birthday = 6;
}
