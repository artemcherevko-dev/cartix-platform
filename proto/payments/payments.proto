syntax = "proto3";

option go_package = "proto/payments;paymentspb";

service Payments {
  rpc CreatePayment (CreatePaymentReq) returns (CreatePaymentRes);

  rpc GetPayment (GetPaymentReq) returns (PaymentRes);

  rpc AdminListPayments (AdminListPaymentsReq) returns (AdminListPaymentsRes);

  rpc AdminDeletePayment (AdminDeletePaymentReq) returns (AdminDeletePaymentRes);
}

message CreatePaymentReq {
  string order_id = 1;
  int64 amount_minor = 2;
  string currency = 3;
  string customer_email = 4;
  string description = 5;
}

message CreatePaymentRes {
  string payment_id = 1;
  string checkout_url = 2;
}

message GetPaymentReq {
  string payment_id = 1;
  string order_id = 2;
}

message PaymentRes {
  string id = 1;
  string order_id = 2;
  string status = 3;
  string provider = 4;
  int64 amount_minor = 5;
  string currency = 6;
  string checkout_url = 7;
  string created_at = 8;
  string paid_at = 9;
}

message AdminListPaymentsReq {
  string order_id = 1;
}

message AdminListPaymentsRes {
  repeated PaymentRes payments = 1;
}

message AdminDeletePaymentReq {
  string payment_id = 1;
}

message AdminDeletePaymentRes {
  bool deleted = 1;
}
