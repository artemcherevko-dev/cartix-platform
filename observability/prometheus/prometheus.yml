global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: cartix-services
    static_configs:
      - targets: [auth-service:9090, profile-service:9090, catalog-service:9090, order-service:9090, payments-service:9090, notification-service:9090, gateway:9090]
  - job_name: node
    static_configs: [{targets: [node-exporter:9100]}]
  - job_name: cadvisor
    static_configs: [{targets: [cadvisor:8080]}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121]}]
  - job_name: postgres
    static_configs: [{targets: [postgres-exporter:9187]}]
  - job_name: nats
    static_configs: [{targets: [nats-exporter:7777]}]
